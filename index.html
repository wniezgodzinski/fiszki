<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15936a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fiszki ES">
  <title>Fiszki ES</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">¡Fiszki!</div>
    <button id="profileBtn" class="profile-btn" type="button" aria-label="Zmień profil" hidden></button>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="home" type="button"><span class="ico">🏠</span><span>Start</span></button>
    <button data-tab="words" type="button"><span class="ico">📚</span><span>Słowa</span></button>
    <button data-tab="stats" type="button"><span class="ico">📈</span><span>Statystyki</span></button>
    <button data-tab="settings" type="button"><span class="ico">⚙️</span><span>Ustawienia</span></button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>

  <script src="srs.js"></script>
  <script src="app.js"></script>
</body>
</html>
